<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mr. Big-Eye</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />
    <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    ></script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <h1>Mr. Big-Eye</h1>
          <button id="new-session-button" type="button" title="New session">+</button>
        </div>
        <div class="identity-row">
          <span id="user-tag" class="user-tag"></span>
          <button id="switch-user-button" type="button">Switch</button>
        </div>
        <div id="session-list" class="session-list"></div>
      </aside>

      <section class="workspace">
        <section class="upload-panel">
          <div class="upload-row">
            <input id="video-file" type="file" accept="video/*" />
            <button id="upload-button" type="button">Upload</button>
          </div>
          <progress id="upload-progress" value="0" max="100"></progress>
          <div id="upload-status" class="status-line"></div>
        </section>

        <section class="chat-panel">
          <div id="messages" class="messages"></div>
          <form id="chat-form" class="composer">
            <input
              id="question-input"
              type="text"
              autocomplete="off"
              placeholder="Ask about the video, or just say hi"
            />
            <button id="send-button" type="submit">Send</button>
          </form>
        </section>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
